# Field classification policy for Metadata/project_settings.config keys.
#
# default_policy: passthrough -- but only for keys the TARGET slicer actually
# defines. core/vocabulary.py filters the finished config against the target
# fork's own PrintConfig.cpp vocabulary before it is written, so "passthrough"
# here means "keep this key's value rather than regenerate it", not "emit it
# no matter what".
#
# That qualifier was learned the hard way. This file originally claimed a
# stray field was low-risk because both slicers are OrcaSlicer-derived and
# "tolerated by both". They are not: Snapmaker Orca is a *fork* that has added
# ~250 settings Bambu Studio has never heard of, roughly a third of a real
# project's config. Handing those to Bambu Studio produced a run of failures
# that each looked like a different bug -- "Invalid configuration file", print
# settings reverting to target defaults, and finally "The file does not
# contain any geometry data" on a file whose geometry part was byte-for-byte
# identical to the source's.
#
# The passthrough default still holds for everything inside the target's
# vocabulary: a survey of 745 unique keys across 5 real project files found
# most remaining differences were slicer-version skew rather than hardware
# incompatibility, and silently regenerating a field that should have been
# kept destroys a real user customization.
#
# regenerate: fields tied to physical machine identity, kinematics, or the
# logical-color-slot -> physical-extruder/AMS routing. These must be rebuilt
# from the target's own default profile (see core/preset_resolver.py +
# convert/color_mapping.py), never copied from the source printer. Confirmed
# by direct diff of real project files: Bambu H2C carries master_extruder_id
# / physical_extruder_map / extruder_ams_count / extruder_nozzle_stats /
# filament_map (AMS + dual-hotend routing); the Snapmaker U1 sample has NONE
# of these fields at all (4 independent direct-drive toolheads, no AMS
# grouping concept to encode).
#
# drop: derived/cache data that can be actively *wrong* for the target, not
# just irrelevant. Real example: a U1 sample's plate_1.json still listed
# "@BBL H2C" filament preset names left over from before the project was
# re-targeted at U1 (see profiles/SOURCES.md) -- carrying that forward would
# propagate stale cross-printer references. These are regenerated by the
# target slicer the next time it slices or saves; nothing reads them back
# from the .3mf on its own.

default_policy: passthrough

regenerate:
  # machine identity / preset pointers -- pipeline.py sets these explicitly
  # to the target printer's own preset names, never copies the source's.
  - printer_settings_id
  - printer_model
  - printer_variant
  - print_settings_id

  # logical-color-slot -> physical-extruder/AMS routing
  - master_extruder_id
  - physical_extruder_map
  - extruder_ams_count
  - extruder_nozzle_stats
  - filament_map
  - wiping_volumes_extruders
  - wiping_volumes_matrix   # not seen unmodified in samples, but size = filament_count^2 when present -- stale/wrong-sized after a color-count change

  # machine kinematics / hardware limits
  - nozzle_diameter
  - printable_area
  - printable_height
  - bed_exclude_area
  - bed_mesh_min
  - bed_mesh_max
  - bed_mesh_probe_distance
  - extruder_clearance_dist_to_rod
  - extruder_clearance_height_to_lid
  - extruder_clearance_height_to_rod
  - extruder_clearance_max_radius
  - extruder_clearance_radius
  - extruder_offset
  - extruder_printable_area
  - extruder_variant_list
  - extruder_max_nozzle_count
  - printer_extruder_id
  - printer_extruder_variant
  - machine_max_acceleration_e
  - machine_max_acceleration_extruding
  - machine_max_acceleration_retracting
  - machine_max_acceleration_travel
  - machine_max_acceleration_x
  - machine_max_acceleration_y
  - machine_max_acceleration_z
  - machine_max_jerk_e
  - machine_max_jerk_x
  - machine_max_jerk_y
  - machine_max_jerk_z
  - machine_max_junction_deviation
  - machine_max_speed_e
  - machine_max_speed_x
  - machine_max_speed_y
  - machine_max_speed_z
  - machine_min_extruding_rate
  - machine_min_travel_rate
  - machine_load_filament_time
  - machine_unload_filament_time
  - machine_tool_change_time
  - retract_length_toolchange
  - retract_lift_below
  - retraction_distances_when_cut
  - long_retractions_when_cut
  - nozzle_volume
  - nozzle_type
  - nozzle_height
  - nozzle_hrc
  - required_nozzle_HRC
  - single_extruder_multi_material

  # machine gcode -- printer-firmware-specific macros, meaningless verbatim
  # on a different controller/kinematics.
  - machine_start_gcode
  - machine_end_gcode
  - machine_pause_gcode
  - change_filament_gcode
  - change_extrusion_role_gcode
  - layer_change_gcode
  - before_layer_change_gcode
  - time_lapse_gcode
  - template_custom_gcode
  - printing_by_object_gcode

  # host/connection settings -- meaningless across machines
  - host_type
  - print_host
  - print_host_webui
  - printhost_apikey
  - printhost_authorization_type
  - printhost_cafile
  - printhost_password
  - printhost_port
  - printhost_ssl_ignore_revoke
  - printhost_user
  - bbl_use_printhost

  # cosmetic per-machine defaults
  - thumbnails
  - thumbnails_format

  # "which settings deviate from the presets this project names". Listed
  # under regenerate rather than drop, and NOT filled from a machine preset
  # like the keys above -- convert/pipeline.py recomputes it against the
  # target's own print and machine presets via convert/settings_diff.py.
  #
  # An earlier version dropped this outright, reasoning it was stale UI
  # state the slicer would recompute. That was wrong, and it silently broke
  # real conversions: it is the *only* thing telling the slicer that a
  # project naming a stock preset doesn't actually hold that preset's
  # values. Without it, Bambu Studio served its own defaults for layer
  # height / infill / wall count and discarded the source's -- which were
  # sitting in the file, correctly converted, the whole time.
  - different_settings_to_system

drop: []

# Whole Metadata/ files are handled at the archive level (convert/pipeline.py),
# not per-field: numbered *_settings_N.config snapshots, slice_info.config,
# plate_N.json and filament_sequence.json are dropped and left for the target
# slicer to regenerate. cut_information.xml (Cut-tool edit state) and
# thumbnails/gcode previews pass through as opaque bytes.
