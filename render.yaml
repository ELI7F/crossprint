# Render blueprint for Crossprint. Deploy with: New > Blueprint, point at this repo.
#
# One worker, two threads, and only one conversion at a time (enforced in
# web/app.py). Conversion streams parts rather than loading them, so peak RSS is
# flat in project size -- 74 MB for a 726 MB project. The second worker is still
# not worth it on a 512 MB instance; the extra thread exists so page loads and
# the health check stay responsive during a conversion.
services:
  - type: web
    name: crossprint
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir web app:app --workers 1 --threads 2 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # These override web/app.py's defaults, so they are what actually applies
      # in production -- changing the code defaults alone does nothing here.
      #
      # The upload cap is not about memory: uploads spool to disk, and peak RSS
      # is flat in project size. It bounds how long a request may sit streaming
      # in.
      - key: MAX_UPLOAD_MB
        value: "300"
      # Uncompressed size no longer predicts memory use, so this is only a
      # zip-bomb backstop. Geometry compresses ~6x, so a 95 MB upload can
      # legitimately hold well over 500 MB of meshes.
      - key: MAX_UNCOMPRESSED_MB
        value: "3072"
      # Optional tip jar. Set a link here (Ko-fi, Buy Me a Coffee, GitHub
      # Sponsors...) and a support button appears; leave it out and there is
      # no button at all.
      # - key: DONATE_URL
      #   value: https://ko-fi.com/yourname
